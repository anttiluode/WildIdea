name: W2 adaptive probe choice

on:
  push:
    paths:
      - "wildidea_w2.py"
      - "docs/PREREG_W2.md"
      - ".github/workflows/w2-adaptive-probe.yml"
  workflow_dispatch:

jobs:
  w2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Mechanism invariants
        run: |
          python - <<'PY'
          import wildidea_w2 as w
          assert len(w.CANDIDATE_CENTERS) == 8
          assert w.PROBE_BUDGET == 3
          assert w.PROBE_BUDGET < len(w.CANDIDATE_CENTERS)
          for c in range(8):
              x = w.probe_receipt(c, 4242+c, c)
              assert isinstance(x, float)
          print('W2 mechanism invariants ok')
          PY
      - name: Run frozen W2 benchmark
        run: python wildidea_w2.py --json artifacts/w2_result.json
      - name: Show result
        run: cat artifacts/w2_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: w2-adaptive-probe-result
          path: artifacts/w2_result.json
