name: W4 nuisance quotient gate

on:
  push:
    branches: ["main"]
    paths:
      - "wildidea_w4_nuisance.py"
      - "tests/test_w4_nuisance.py"
      - "docs/PREREG_W4_NUISANCE_QUOTIENT.md"
      - ".github/workflows/w4-nuisance-quotient.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run focused tests
        run: python -m unittest tests.test_w4_nuisance -v
      - name: Run frozen holdout gate
        run: python wildidea_w4_nuisance.py --json artifacts/w4_nuisance_result.json
      - name: Upload W4 receipt
        uses: actions/upload-artifact@v4
        with:
          name: w4-nuisance-result
          path: artifacts/w4_nuisance_result.json
