name: W4b validated fixed adversary

on:
  push:
    branches: ["main"]
    paths:
      - "wildidea_w4b_validated_fixed.py"
      - "tests/test_w4b_validated_fixed.py"
      - "docs/PREREG_W4B_VALIDATED_FIXED.md"
      - ".github/workflows/w4b-validated-fixed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run focused tests
        run: python -m unittest tests.test_w4b_validated_fixed -v
      - name: Run frozen strong-baseline gate
        run: python wildidea_w4b_validated_fixed.py --json artifacts/w4b_validated_fixed_result.json
      - name: Upload W4b receipt
        uses: actions/upload-artifact@v4
        with:
          name: w4b-validated-fixed-result
          path: artifacts/w4b_validated_fixed_result.json
